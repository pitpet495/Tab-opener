<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi Tab Opener</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1b1f27;--muted:#667085;--border:#d9dce3;--accent:#3b6cf6;--accent-t:#fff;--ok:#16a34a;--err:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151a;--card:#1c1f27;--text:#eef0f4;--muted:#9aa1b0;--border:#2d313c;--accent:#6f93ff;--accent-t:#0d1220}}
:root[data-theme="dark"]{--bg:#13151a;--card:#1c1f27;--text:#eef0f4;--muted:#9aa1b0;--border:#2d313c;--accent:#6f93ff;--accent-t:#0d1220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
h1{font-size:1.3rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px;font-size:1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:20px;padding:13px;font-size:1rem;font-weight:600;border:0;border-radius:10px;cursor:pointer;background:var(--accent);color:var(--accent-t)}
#status{margin-top:18px;font-size:.92rem;word-break:break-word}
.ok{color:var(--ok)}.err{color:var(--err)}
.note{margin-top:18px;font-size:.78rem;color:var(--muted);line-height:1.4}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>🗂️ Multi Tab Opener</h1>
  <p class="sub">Open the same website in several new tabs at once.</p>

  <label for="url">Website</label>
  <input id="url" type="text" inputmode="url" placeholder="example.com" autocomplete="off">

  <label for="count">How many times</label>
  <input id="count" type="number" min="1" max="50" value="5" inputmode="numeric">

  <button id="go">Open tabs</button>
  <div id="status"></div>

  <p class="note">If your browser blocks some tabs, allow pop-ups for this page and try again.</p>
</div>

<script>
(function(){
  var urlEl=document.getElementById('url'),countEl=document.getElementById('count'),
      go=document.getElementById('go'),status=document.getElementById('status');
  function say(msg,cls){status.className=cls||'';status.textContent=msg;}
  function normalize(v){
    v=v.trim(); if(!v) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v='https://'+v;
    try{var u=new URL(v);
      if(!/^https?:$/.test(u.protocol)) return null;
      if(!u.hostname.includes('.')&&u.hostname!=='localhost') return null;
      return u.href;}catch(e){return null;}
  }
  go.addEventListener('click',function(){
    var url=normalize(urlEl.value);
    if(!url){say('Please enter a valid website, e.g. example.com','err');return;}
    var n=parseInt(countEl.value,10);
    if(!n||n<1){say('Please enter a number of 1 or more.','err');return;}

    say('Opening ' + n + ' tabs...', '');
    var opened=0;
    var i = 0;
    
    var interval = setInterval(function() {
      if (i >= n) {
        clearInterval(interval);
        if(opened===n) say('Successfully opened all '+opened+' tabs!', 'ok');
        else say('Opened '+opened+' of '+n+'. Browser blocked the rest due to popup limits.','err');
        return;
      }
      
      var w = null;
      try { 
        w = window.open(url, '_blank');
        if (w) opened++;
      } catch(e) {}
      
      i++;
    }, 200);
  });
})();
</script>
</body>
</html>
